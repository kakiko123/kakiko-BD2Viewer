# ============================================================
#  Gradle 构建配置（随仓库公开）
#
#  这里只放与机器无关的设置。任何「只在我这台机器上成立」的东西
#  —— 代理地址、镜像地址、签名口令、SDK 路径 —— 都不要写在这里：
#    · SDK / JDK 路径       -> bd2-android/local.properties（已被 .gitignore）
#    · 代理                -> ~/.gradle/gradle.properties 或命令行 -D 参数
#    · 签名口令 / 密钥库路径 -> bd2-android/gradle.local.properties（已被 .gitignore）
# ============================================================

org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.daemon=true

# 本工程不依赖 AndroidX / Jetifier（纯手写 Activity + WebView）
android.useAndroidX=false
android.enableJetifier=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true
# 需要 BuildConfig.DEBUG 来区分调试/正式构建（见 MainActivity 里的 WebView 调试开关）
android.defaults.buildfeatures.buildconfig=true

# ------------------------------------------------------------
#  需要走代理才能拉到 AGP / 依赖时
# ------------------------------------------------------------
# 国内网络直连 google() / mavenCentral() 常常不通。不要改这个文件，
# 去写 Gradle 官方的「机器级」配置（它不会被任何仓库收录）：
#
#   %USERPROFILE%\.gradle\gradle.properties     (Windows)
#   ~/.gradle/gradle.properties                 (macOS / Linux)
#
# 内容示例（主机和端口换成你自己的）：
#   systemProp.http.proxyHost=127.0.0.1
#   systemProp.http.proxyPort=7890
#   systemProp.https.proxyHost=127.0.0.1
#   systemProp.https.proxyPort=7890
#   systemProp.http.nonProxyHosts=localhost|127.0.0.1
#   systemProp.https.nonProxyHosts=localhost|127.0.0.1
#
# 或者一次性用命令行传（注意 --no-daemon 时 daemon 的 JVM 只认 org.gradle.jvmargs，
# 所以代理要用 -D 传给 Gradle 自身，而不是塞进 jvmargs）：
#   gradle -Dhttp.proxyHost=127.0.0.1 -Dhttp.proxyPort=7890 assembleDebug
